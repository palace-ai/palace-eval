site_name: PALACE Documentation
site_description: Platform for Automated LLMs Agentic Capabilities Evaluation

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Your First Benchmark: getting-started/first-benchmark.md
  - Task Types:
    - task-types/index.md
    - QA: task-types/qa.md
    - Classification: task-types/classification.md
    - Report Generation: task-types/report-generation.md
  - How-To Guides:
    - howto/index.md
    - Run Evaluations: howto/run-evaluations.md
    - Custom Criteria: howto/custom-criteria.md
    - Publish to HuggingFace: howto/publish-huggingface.md
    - Debug Evaluations: howto/debug-evaluations.md
    - Migration Guide: howto/migration.md
  - Reference:
    - reference/index.md
    - info.json: reference/info-json.md
    - tasks.json: reference/tasks-json.md
    - Task Type Fields: reference/task-type-fields.md
    - Output Metrics: reference/metrics.md
    - CLI Reference: reference/cli.md
  - Concepts:
    - concepts/index.md
    - Evaluation Pipeline: concepts/evaluation-pipeline.md
    - Verification Methods: concepts/verification.md
    - LLM Judges: concepts/llm-judges.md
  - Examples:
    - examples/index.md
    - Factual QA: examples/factual-qa.md
    - Safety Classification: examples/safety-classification.md
    - Sycophancy Evaluation: examples/sycophancy.md
    - Research Reports: examples/research-reports.md
  - Glossary: glossary.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search
