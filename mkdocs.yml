site_name: PALACE Documentation
site_description: Platform for Automated LLMs Agentic Capabilities Evaluation

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Your First Benchmark: getting-started/first-benchmark.md
  - Task Types:
    - task-types/index.md
    - QA: task-types/qa.md
    - Classification: task-types/classification.md
    - Report Generation: task-types/report-generation.md
  - How-To Guides:
    - howto/index.md
    - Run Evaluations: howto/run-evaluations.md
    - Custom Criteria: howto/custom-criteria.md
    - Model Adapters: howto/model-adapters.md
    - Publish to HuggingFace: howto/publish-huggingface.md
    - Debug Evaluations: howto/debug-evaluations.md
    - Migration Guide: howto/migration.md
    - Add Public Benchmark: howto/add-public-benchmark.md
  - Reference:
    - reference/index.md
    - Official Tasklists:
      - reference/tasklists/index.md
      - GuardBench: reference/tasklists/guardbench.md
      - Sycophancy: reference/tasklists/sycophancy.md
      - ValuesEval24: reference/tasklists/valueseval24.md
      - DocRetrieval: reference/tasklists/docretrieval.md
      - DeepConsult: reference/tasklists/deepconsult.md
      - DeepResearchBench: reference/tasklists/deepresearchbench.md
    - Public Benchmarks: reference/public-benchmarks.md
    - info.json: reference/info-json.md
    - tasks.json: reference/tasks-json.md
    - Task Type Fields: reference/task-type-fields.md
    - Output Metrics: reference/metrics.md
    - CLI Reference: reference/cli.md
    - API Reference:
      - reference/api/index.md
      - evaluate(): reference/api/evaluate.md
      - Evaluation: reference/api/evaluation.md
      - Task Types: reference/api/task-types.md
      - Agents: reference/api/agents.md
      - Judge: reference/api/judge.md
      - Analyzers: reference/api/analyzers.md
      - I/O Adapters: reference/api/io-adapters.md
  - Concepts:
    - concepts/index.md
    - Evaluation Pipeline: concepts/evaluation-pipeline.md
    - Verification Methods: concepts/verification.md
    - LLM Judges: concepts/llm-judges.md
  - Examples:
    - examples/index.md
    - Factual QA: examples/factual-qa.md
    - Safety Classification: examples/safety-classification.md
    - Sycophancy Evaluation: examples/sycophancy.md
    - Research Reports: examples/research-reports.md
  - Glossary: glossary.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_root_heading: true
            show_symbol_type_heading: true

use_directory_urls: false