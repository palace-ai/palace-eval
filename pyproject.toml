# pyproject.toml
[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palace-eval"
version = "1.0.13"
description = "An open benchmark format for LLM evaluation, with native agentic support."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Massimiliano ALTIERI", email = "massimiliano.altieri@ec.europa.eu" },
]
maintainers = [
    { name = "European Commission Joint Research Centre" },
]
license = { text = "EUPL-1.2" }
keywords = [
    "llm",
    "evaluation",
    "benchmark",
    "ai",
    "machine-learning",
    "agents",
    "agentic",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic>=0.83.0",
    "beautifulsoup4>=4.14.0",
    "click>=8.0",
    "datasets>=4.8.0",
    "emoji>=2.15.0",
    "filetype>=1.2.0",
    "huggingface-hub>=0.36.0",
    "ipython>=9.0.0",
    "mcp>=1.21.0,<2",
    "openai>=2.37.0",
    "pandas>=2.3.0",
    "Pillow>=12.0.0",
    "platformdirs>=4.5.0",
    "psutil>=7.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.2.0",
    "questionary>=2.1.0",
    "Requests>=2.32.0",
    "tenacity>=9.1.0",
    "wcwidth>=0.2.14",
]

[project.urls]
Homepage = "https://code.europa.eu/palace/palace-eval"
Documentation = "https://palace.pages.code.europa.eu/palace-eval"
Repository = "https://code.europa.eu/palace/palace-eval"
Issues = "https://github.com/palace-ai/palace-eval/issues"
Changelog = "https://code.europa.eu/palace/palace-eval/-/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["ruff>=0.6.0", "pytest>=8.0.0"]

[project.scripts]
palace = "palace.cli:main"
# Deprecated entrypoints - show warning then invoke legacy behavior
palace-cli = "palace.entrypoints.deprecated:palace_cli_deprecated"
palace-run = "palace.entrypoints.deprecated:palace_run_deprecated"
palace-download = "palace.entrypoints.deprecated:palace_download_deprecated"

[tool.setuptools.package-data]
palace = [
    "prompts/*.md",
    "entrypoints/download/*.json",
    "download/*.json",
    "bundled_io_adapters.yaml",
    "bundled_model_extra_params.yaml",
]


[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E731",   # lambda assignment
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__ are fine (re-exports)
