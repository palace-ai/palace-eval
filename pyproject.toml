# pyproject.toml
[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palace-eval"
version = "1.0.0"
description = "A Platform for Automated LLMs Agentic Capabilities Evaluation."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Massimiliano ALTIERI", email = "massimiliano.altieri@ec.europa.eu" },
]
maintainers = [
    { name = "European Commission Joint Research Centre" },
]
license = { text = "EUPL-1.2" }
keywords = [
    "llm",
    "evaluation",
    "benchmark",
    "ai",
    "machine-learning",
    "agents",
    "agentic",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: European Union Public Licence 1.2 (EUPL 1.2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "anthropic==0.83.0",
    "beautifulsoup4==4.14.2",
    "datasets>=4.7.0",
    "emoji==2.15.0",
    "filetype==1.2.0",
    "huggingface_hub",
    "ipython==9.7.0",
    "mcp==1.21.0",
    "openai",
    "pandas==2.3.3",
    "Pillow>=10.0.0",
    "platformdirs==4.5.1",
    "psutil==7.1.3",
    "PyYAML>=6.0",
    "python-dotenv==1.2.1",
    "questionary==2.1.1",
    "Requests==2.32.5",
    "tenacity==9.1.2",
    "wcwidth==0.2.14",
]

[project.urls]
Homepage = "https://github.com/palace-ai/palace-eval"
Documentation = "https://palace.pages.code.europa.eu/palace-eval"
Repository = "https://github.com/palace-ai/palace-eval"
Issues = "https://github.com/palace-ai/palace-eval/issues"
Changelog = "https://github.com/palace-ai/palace-eval/blob/main/CHANGELOG.md"

[project.scripts]
palace-cli = "palace.entrypoints.palace_cli:main"
palace-run = "palace.entrypoints.palace_run:run"
palace-download = "palace.entrypoints.download.palace_download:main"

[tool.setuptools.package-data]
palace = [
    "prompts/*.md",
    "entrypoints/download/*.json",
    "bundled_io_adapters.yaml",
]


[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E731",   # lambda assignment
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # unused imports in __init__ are fine (re-exports)
