# pyproject.toml
[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palace"
version = "0.1"
description = "A Platform for Automated LLMs Agentic Capabilities Evaluation."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Massimiliano ALTIERI", email = "massimiliano.altieri@ec.europa.eu" },
]
# license = { text = "TBD" }  # TODO: Choose before public release
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anyio==4.11.0",
    "beautifulsoup4==4.14.2",
    "datasets==4.4.1",
    "emoji==2.15.0",
    "filetype==1.2.0",
    "huggingface_hub==0.36.0",
    "ipython==9.7.0",
    "mcp==1.21.0",
    "nest_asyncio==1.6.0",
    "openai==2.7.2",
    "pandas==2.3.3",
    "platformdirs==4.5.1",
    "psutil==7.1.3",
    "pydantic==2.12.4",
    "pymupdf==1.26.6",
    "python-dotenv==1.2.1",
    "questionary==2.1.1",
    "Requests==2.32.5",
    "starlette==0.49.3",
    "tenacity==9.1.2",
    "transformers==4.57.1",
    "uvicorn==0.38.0",
    # "vllm==0.11.0",
    "wcwidth==0.2.14",
]

[project.urls]
Homepage = "https://gitlab.jrc.ec.europa.eu/jrc-projects/jrc-gpt/evaluation/palace-lib"
Documentation = "https://gitlab.jrc.ec.europa.eu/jrc-projects/jrc-gpt/evaluation/palace-lib"

[project.scripts]
palace-cli = "palace.entrypoints.palace_cli:main"
palace-run = "palace.entrypoints.palace_run:run"
palace-mcpstart = "palace.entrypoints.palace_mcpstart:main"
palace-download = "palace.entrypoints.download.palace_download:main"

[tool.setuptools.package-data]
palace = [
    "prompts/*.md",
    "entrypoints/download/*.json"
]
