name: Mirror to code.europa.eu

on:
  push:
    branches: [main]
    tags: ['v*']
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git push --mirror https://oauth2:${GITLAB_TOKEN}@code.europa.eu/palace/palace-eval.git
