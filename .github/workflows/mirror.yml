name: Mirror to code.europa.eu

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git push --force https://oauth2:${GITLAB_TOKEN}@code.europa.eu/palace/palace-eval.git HEAD:main
          git push --tags https://oauth2:${GITLAB_TOKEN}@code.europa.eu/palace/palace-eval.git
